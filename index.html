<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Admissões – Rio Ave</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0D0E;--surface:#161618;--surface2:#1C1C1F;--ink:#F2F2F3;--ink2:#A4A4AA;--ink3:#7C7C82;--line:#2A2A2E;
  --yellow:#F2F2F3;--yellow-ink:#0D0D0E;--blue:#8EB9E2;--blue-bg:#1A2734;--green:#7FC9A0;--green-bg:#152A22;
  --red:#F09289;--red-bg:#3A1C1A;--amber:#E9B85E;--amber-bg:#30250F;--gray-bg:#252528;
  color-scheme:dark;
  --font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D0E;--surface:#161618;--surface2:#1C1C1F;--ink:#F2F2F3;--ink2:#A4A4AA;--ink3:#7C7C82;--line:#2A2A2E;
  --yellow:#F2F2F3;--yellow-ink:#0D0D0E;--blue:#8EB9E2;--blue-bg:#1A2734;--green:#7FC9A0;--green-bg:#152A22;
  --red:#F09289;--red-bg:#3A1C1A;--amber:#E9B85E;--amber-bg:#30250F;--gray-bg:#252528;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0E;--surface:#161618;--surface2:#1C1C1F;--ink:#F2F2F3;--ink2:#A4A4AA;--ink3:#7C7C82;--line:#2A2A2E;
  --yellow:#F2F2F3;--yellow-ink:#0D0D0E;--blue:#8EB9E2;--blue-bg:#1A2734;--green:#7FC9A0;--green-bg:#152A22;
  --red:#F09289;--red-bg:#3A1C1A;--amber:#E9B85E;--amber-bg:#30250F;--gray-bg:#252528;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,var(--ink) 10px 20px)}
.top{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-stretch:75%;font-weight:800;font-size:22px;margin:0}
.brand small{font-stretch:100%;font-weight:400;font-size:13px;color:var(--ink2);margin-left:8px}
.top .sp{flex:1}
nav{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{padding:12px 14px 10px;text-decoration:none;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav a.on{color:var(--ink);border-bottom-color:var(--yellow)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters label{font-size:13px;color:var(--ink2)}
select,input[type=text],input[type=date],input[type=time],input[type=search],input[type=number],textarea,input:not([type]){border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-height:36px}
textarea{width:100%;min-height:150px;resize:vertical}
h2{font-stretch:80%;font-weight:700;font-size:18px;margin:0 0 10px}
.muted{color:var(--ink2)}.small{font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.t-red{background:var(--red-bg);color:var(--red)}.t-amber{background:var(--amber-bg);color:var(--amber)}
.t-blue{background:var(--blue-bg);color:var(--blue)}.t-green{background:var(--green-bg);color:var(--green)}.t-gray{background:var(--gray-bg);color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h2 .muted{font-stretch:100%;font-weight:400;font-size:13px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--ink3)}
.kpi .n{font-stretch:62%;font-weight:800;font-size:52px;line-height:1;display:block;margin:4px 0 2px}
.kpi .l{font-weight:600;font-size:14px}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.alert{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.kpi.alert .s{color:var(--red)}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.funil{display:grid;grid-template-columns:minmax(0,150px) 34px minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px}
.funil .bar{height:14px;background:var(--gray-bg);border-radius:2px;overflow:hidden;display:flex}
.funil .bar i{display:block;height:100%}
.funil .nm{cursor:pointer}.funil .nm:hover{text-decoration:underline}
.funil b{font-stretch:70%;font-weight:800;font-size:22px;text-align:right}
.vg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4px 12px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.vg:first-of-type{border-top:none}
.stack{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--gray-bg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:16px}
.bar2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px}
.bar2 .pair{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%}
.bar2 .pair span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;font-weight:700}
.bar2 .pair i{display:block;width:100%;border-radius:2px 2px 0 0;min-height:2px}
.bar2 .m{color:var(--ink2);margin-top:5px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hb i{display:block;height:11px;border-radius:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.list li:first-child{border-top:none}
.list .who{flex:1;min-width:0}
.list .who b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tw tbody tr{cursor:pointer}.tw tbody tr:hover{background:var(--surface2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip.red{border-color:var(--red);color:var(--red)}.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.colk{background:var(--surface2);border:1px solid var(--line);border-top:4px solid var(--tone);border-radius:0 0 8px 8px;padding:8px;min-height:120px}
.colk.over{outline:2px dashed var(--blue);outline-offset:-4px}
.colk h3{font-size:14px;font-weight:700;margin:0 2px 2px;display:flex;justify-content:space-between}
.colk .hint{font-size:12px;color:var(--ink2);margin:0 2px 4px}
.lane{margin-bottom:18px}
.lane .colk{min-height:60px}
.lane h2{display:flex;gap:8px;align-items:baseline}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--age,var(--line));border-radius:0 6px 6px 0;padding:8px 9px;margin-top:6px;font-size:12.5px;cursor:grab}
.card.dragging{opacity:.4}
.card .h{display:flex;gap:6px;align-items:flex-start}
.card .h b{flex:1;font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.3}
.card .h b:hover{text-decoration:underline}
.age{font-size:11.5px;font-weight:700;white-space:nowrap}
.sig{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.sig span{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink3)}
.sig .ok{background:var(--green-bg);color:var(--green);border-color:transparent}
.sig .bad{background:var(--red-bg);color:var(--red);border-color:transparent}
.sig .wait{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.alertline{color:var(--red);font-weight:600;font-size:12px;margin-top:5px}
.acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;align-items:center}
.acts input[type=date]{min-height:28px;padding:2px 6px;font-size:12.5px}
.wa{margin-left:auto;font-size:12px;font-weight:600;color:var(--green);text-decoration:none;padding:3px 6px;border-radius:4px}
.wa:hover{background:var(--green-bg)}
dialog{border:none;border-radius:10px;padding:0;width:min(760px,96vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog.mini{width:min(500px,94vw)}
dialog::backdrop{background:rgba(10,14,16,.55)}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dh h2{margin:0;flex:1}
.db{padding:16px 20px;overflow:auto}
.fs{border:none;margin:0 0 16px;padding:0}
.fs legend{font-weight:700;font-stretch:85%;font-size:15px;margin-bottom:8px;padding:0}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2)}
.fg label.w2{grid-column:span 2}.fg label.w3{grid-column:1/-1}
.fg input,.fg select{width:100%;color:var(--ink)}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.df .sp{flex:1}
.warn{background:var(--red-bg);color:var(--red);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.log{font-size:12px;color:var(--ink2);margin:0;padding-left:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:92vw}
.banner{background:var(--amber-bg);color:var(--amber);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:14px}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
.err{color:var(--red);font-size:12px}
.vtab td{vertical-align:middle}
.vtab input,.vtab select{width:100%}
@media (max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.fg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kanban{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(250px,78%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .colk{scroll-snap-align:start}}
@media (max-width:520px){#sync{display:none}.top{padding-bottom:4px}main{padding:14px}.kpi .n{font-size:42px}.fg{grid-template-columns:minmax(0,1fr)}.fg label.w2{grid-column:auto}
  .funil{grid-template-columns:minmax(0,115px) 28px minmax(0,1fr)}.funil .x{grid-column:1/-1;margin:-4px 0 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.kanban{grid-template-columns:repeat(6,minmax(0,1fr))}
.sig .click{cursor:pointer}
.sig .click:hover{border-color:var(--ink3)}
.sig .part{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.ck{list-style:none;margin:0;padding:0}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ck li:first-child{border-top:none}
.ck li .txt{flex:1;min-width:0}
.ck li .txt small{display:block;color:var(--ink2);font-size:12px}
.ck li.na .txt{color:var(--ink3);text-decoration:line-through}
.ck input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}
.ck .nab{font-size:12px;color:var(--ink2);white-space:nowrap;display:flex;gap:4px;align-items:center}
.ck .nab input{width:14px;height:14px;accent-color:var(--ink3)}
.ck .dt{font-size:12px;color:var(--green);white-space:nowrap}
.prog{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--green)}
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.etab td{vertical-align:middle;padding:6px}
.etab input{width:100%}
.mtxt{width:100%;min-height:170px;font-size:14px;line-height:1.45}
.msgsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.help{font-size:12px;color:var(--ink2);margin:4px 0 10px}
.help code{background:var(--gray-bg);padding:0 4px;border-radius:3px;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-6px 0 12px}
@media (max-width:1000px){.kanban{grid-template-columns:none}}

/* ---- layout com barra lateral ---- */
header,.stripe{display:none}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside#side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#0B0B0C;color:#B9BCC0;display:flex;flex-direction:column;border-right:1px solid #1F2023;padding:18px 10px 12px;z-index:30;overflow-y:auto}
.sbrand{display:flex;align-items:center;gap:10px;padding:2px 10px 4px}
.sbrand .logo{font-stretch:80%;font-weight:800;font-size:22px;color:#F4F4F5;letter-spacing:-.2px;white-space:nowrap;flex:none}
.sbrand .sys{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#8A8D92}
.obra{font-size:12px;color:#E4E4E7;padding:0 10px 14px;border-bottom:1px solid #1F2023;margin-bottom:18px;font-weight:600;letter-spacing:.3px}
.navlbl{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#7B7E83;padding:0 10px 10px}
#nav{display:flex;flex-direction:column;gap:3px;padding:0;margin:0;max-width:none;overflow:visible}
#nav .ni{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:#B9BCC0;text-decoration:none;border:1px solid transparent;background:none;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-align:left;width:100%}
#nav .ni:hover{background:#151618;color:#F4F4F5}
#nav .ni.on{background:#18191C;border-color:#2A2C30;color:#FFFFFF;font-weight:700}
#nav .ic{width:22px;text-align:center;font-size:17px;line-height:1}
#nav .tx{flex:1}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#2A2C30;color:#E4E4E7;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge.red{background:#B33A3A;color:#fff}
.sfoot{margin-top:auto;border-top:1px solid #1F2023;padding:12px 4px 0;font-size:12.5px;color:#8A8D92}
.content{min-width:0}
.phead{max-width:1320px;margin:0 auto;padding:22px 20px 0;display:flex;align-items:center;gap:12px}
.phead h1{font-stretch:78%;font-weight:800;font-size:28px;margin:0}
.phead .sp{flex:1}
main{padding-top:14px}
.mtop{display:none}
#scrim{display:none}
.stcards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stc{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tone);border-radius:0 0 8px 8px;padding:10px 12px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.stc:hover{border-color:var(--ink3);border-top-color:var(--tone)}
.stc .l{font-size:13px;font-weight:600;color:var(--ink2)}
.stc b{font-stretch:62%;font-weight:800;font-size:44px;line-height:1.05}
.stc .s{font-size:12px;color:var(--ink2)}
.stc.on{background:var(--ink);color:var(--bg);border-color:var(--ink);border-top-color:var(--tone)}
.stc.on .l,.stc.on .s{color:var(--bg);opacity:.85}
.lhead{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.lhead h2{margin:0;flex:1}
.lhead h2 .muted,.pgroup h2 .muted{font-stretch:100%;font-weight:400;font-size:14px}
table.lt td{vertical-align:middle}
table.lt .nm{display:block;font-weight:600}
table.lt .sub{display:block;font-size:12.5px;color:var(--ink2)}
table.lt .sig{margin:0}
table.lt .acts{margin:0;flex-wrap:nowrap}
table.lt .acts input{min-height:30px;padding:2px 6px;font-size:13px}
.dias{font-stretch:70%;font-weight:800;font-size:20px}
.pgroup{margin-bottom:22px}
.pgroup h2{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
a.chip{text-decoration:none;color:inherit}
@media (max-width:1100px){.stcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0B0B0C;color:#F4F4F5;padding:8px 12px}
 .mtop .btn{color:#F4F4F5;font-size:20px;padding:4px 10px}
 .mbrand{font-size:15px;color:#B9BCC0}.mbrand b{color:#fff;font-stretch:80%;font-size:18px;margin-right:6px}
 body::before{background:#0B0B0C}
 aside#side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(290px,84vw);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
 body.menu aside#side{transform:none}
 body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
 .phead{padding-top:16px}.phead h1{font-size:24px}
}
@media (max-width:520px){.stcards{grid-template-columns:repeat(2,minmax(0,1fr))}.stc b{font-size:36px}}

.sbrand{gap:12px;padding:0 10px 10px}
.logoimg{height:34px;width:auto;display:block;flex:none}
.logoimg.sm{height:24px;display:inline-block;vertical-align:middle;margin-right:8px}
.sbrand .sys{font-size:11px;letter-spacing:1.8px;line-height:1.35;color:#9A9DA2}
.mbrand{display:flex;align-items:center}
.phead h1,.stc b,.kpi .n,.funil b,.dias,.stg .n{font-weight:600;letter-spacing:-.5px}
.kpi .n{font-size:46px}.stc b{font-size:40px}
h2{font-weight:600}
.btn.pri:hover{opacity:.88}
body{background:#0D0D0E}
.sbrand{position:relative}
.sidebtn{margin-left:auto;background:none;border:1px solid #2A2C30;color:#B9BCC0;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1;flex:none}
.sidebtn:hover{background:#18191C;color:#fff}
@media (min-width:901px){body.sidecol .shell{grid-template-columns:minmax(0,1fr)}body.sidecol aside#side{display:none}}
#sideShow[hidden]{display:none}
@media (max-width:900px){#sideShow{display:none!important}.sidebtn{display:none}}

#auth{position:fixed;inset:0;z-index:100;background:#0B0B0C;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#auth[hidden]{display:none}
body.bloqueado{overflow:hidden}
.abox{width:min(380px,100%);background:#141416;border:1px solid #26272B;border-radius:12px;padding:28px 26px;color:#E4E4E7}
.alogo{height:44px;display:block;margin:0 auto 6px}
.asys{text-align:center;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#8A8D92;margin:0 0 18px}
.abox h1{font-size:22px;font-weight:600;margin:0 0 14px;color:#fff}
.abox form{display:flex;flex-direction:column;gap:12px}
.abox label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#A4A4AA}
.abox input{background:#0D0D0E;border:1px solid #2E2F33;color:#F2F2F3;border-radius:6px;padding:10px;min-height:42px;font-size:15px}
.abox .btn.pri{justify-content:center;min-height:42px;margin-top:4px}
.alinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin:16px 0 0}
.alinks a{color:#C9CBD0}
.amsg{font-size:13px;padding:8px 10px;border-radius:6px;background:#1E1F22;margin:0 0 12px}
.amsg.err{background:#3A1C1A;color:#F09289}.amsg.ok{background:#152A22;color:#7FC9A0}
.abox code{background:#222;padding:0 4px;border-radius:3px}
#ufoot{margin-bottom:10px}
#ufoot .uname{color:#F2F2F3;font-weight:600;font-size:14px}
#ufoot .urole{font-size:12px;color:#8A8D92;margin-bottom:6px}
#ufoot .btn{color:#C9CBD0;border-color:#2A2C30;padding:3px 10px}

.abox.wide{width:min(720px,100%)}
.steps{font-size:14px;line-height:1.55;padding-left:20px;margin:0 0 14px}
.steps li{margin-bottom:6px}
.sqlbox{width:100%;min-height:200px;background:#0D0D0E;color:#C9CBD0;border:1px solid #2E2F33;border-radius:6px;font:12px/1.45 ui-monospace,Consolas,monospace;padding:10px;margin:4px 0 10px;white-space:pre}

.rfs{border:1px solid var(--line);border-radius:8px;padding:8px 12px 10px;margin:0 0 10px}
.rfs legend{font-size:13px;color:var(--ink2);padding:0 4px}
.ropt{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;cursor:pointer}
.ropt input{accent-color:var(--ink);width:16px;height:16px}
</style>
</head>

const posMap=r=>{const p={};POS.forEach(x=>p[x.k]=(r.pos||{})[x.k]||"");return p};
const posAplica=r=>r.situacao==="Admitido"&&!!r.dataAdmissao&&r.dataAdmissao>=posDesde();
function posResumo(r){const p=posMap(r);const ap=POS.filter(x=>p[x.k]!=="na");const ok=ap.filter(x=>p[x.k]&&p[x.k]!=="na");
  return{tot:ap.length,ok:ok.length,completo:ok.length===ap.length,faltando:ap.filter(x=>!p[x.k]).map(x=>x.t)}}

function etapa(r){
  if(r.situacao==="Admitido")return posAplica(r)&&!posResumo(r).completo?"Pós-admissão":"Admitido";
  if(r.situacao==="Desistiu")return"Desistiu";
  if(!r.dataExame||r.fezExame==="Não")return"Agendar exame";
  if(r.fezExame!=="Sim")return"Exame marcado";
  if(r.aso!=="Apto"||r.doc!=="OK")return"ASO e documentos";
  if(!r.previsao)return"Pronto";
  return"Admissão marcada";
}
function faseDe(r){if(!r.dataExame||r.fezExame!=="Sim")return"Antes do exame";if(r.aso!=="Apto"||r.doc!=="OK")return"Entre exame e ASO";return"Depois de pronto"}
function diasEtapa(r){if(r.situacao==="Admitido")return r.dataAdmissao?Math.max(0,difDias(r.dataAdmissao,hoje())):0;
  const d=r.etapaDesde||r.dataCadastro||(r.criadoEm||"").slice(0,10);return d?Math.max(0,difDias(d,hoje())):0}
const corIdade=d=>d>7?"red":d>3?"amber":"green";
function dupDe(r,excluirId){
  const c=dig(r.cpf),t1=dig(r.tel1),t2=dig(r.tel2),n=norm(r.nome);
  for(const o of S.rows){
    if(o.id===excluirId)continue;
    const ot=[dig(o.tel1),dig(o.tel2)].filter(x=>x.length>=10);let por="";
    if(c.length>=11&&dig(o.cpf)===c)por="CPF";
    else if((t1.length>=10&&ot.includes(t1))||(t2.length>=10&&ot.includes(t2)))por="telefone";
    else if(n&&norm(o.nome)===n)por="nome";
    if(por)return{o,por};
  }
  return null;
}
function analisar(r){
  const h=hoje();r._etapa=etapa(r);r._alerta=null;r._tarefa=null;r._dias=0;r._parado=false;r._docs=docsResumo(r);
  if(r.situacao==="Desistiu")return;
  if(r.situacao==="Admitido"){
    r._dias=diasEtapa(r);
    if(!r.dataAdmissao)r._tarefa="Informar data de admissão";
    else if(r._etapa==="Pós-admissão"){const p=posResumo(r);r._tarefa=`Pós-admissão ${p.ok}/${p.tot}`;r._parado=r._dias>7}
    else if(r.aso==="Pendente")r._tarefa="ASO pendente (já admitido)";
    else if(r.doc==="Pendente")r._tarefa="Regularizar documentação";
    return;
  }
  r._dias=diasEtapa(r);r._dup=dupDe(r,r.id);
  if(r._dup)r._alerta="Possível duplicidade";
  else if(r.aso==="Inapto")r._alerta="ASO inapto";
  else if(r.fezExame==="Não")r._alerta="Faltou ao exame";
  else if(r.dataExame&&!r.fezExame&&r.dataExame<h)r._alerta="Exame passou: confirmar";
  else if(r.previsao&&r.previsao<h&&r._etapa==="Admissão marcada")r._alerta="Admissão vencida: registrar";
  const e=r._etapa;
  if(e==="Agendar exame")r._tarefa="Agendar exame";
  else if(e==="Exame marcado")r._tarefa=r.dataExame<h?"Confirmar exame":null;
  else if(e==="ASO e documentos"){
    if(r.aso!=="Apto"&&r.dataExame&&diasUteis(r.dataExame,h)>=2)r._tarefa="Cobrar ASO";
    else if(r.doc!=="OK")r._tarefa="Cobrar documentos";
  }
  else if(e==="Pronto")r._tarefa="Marcar admissão";
  r._parado=r._dias>7;
}

  if(r.situacao==="Admitido"){const p=posResumo(r);return`<span class="${p.completo?"ok":p.ok?"part":""}${c}" ${clic?`data-pos="${r.id}" role="button" tabindex="0"`:""} title="${esc(p.faltando.join("; "))}">Pós ${p.ok}/${p.tot}</span>`}
  let e;if(r.fezExame==="Sim")e=`<span class="ok">Exame ✓</span>`;else if(r.fezExame==="Não")e=`<span class="bad">Faltou</span>`;
  else if(r.dataExame)e=`<span class="${r.dataExame<h?"bad":"wait"}">Exame ${brc(r.dataExame)}${r.horaExame?" "+esc(r.horaExame):""}</span>`;else e=`<span>Exame</span>`;
  const a=r.aso==="Apto"?`<span class="ok">ASO ✓</span>`:r.aso==="Inapto"?`<span class="bad">Inapto</span>`:`<span>ASO</span>`;
  const p=r.previsao&&r._etapa==="Admissão marcada"?`<span class="${r.previsao<h?"bad":"wait"}">Adm. ${brc(r.previsao)}</span>`:"";
  return ds+e+a+p;
}
function acoes(r){
  const e=r._etapa,b=(q,t,cls)=>`<button class="btn sm ${cls||""}" data-q="${q}" data-id="${r.id}">${t}</button>`;
  const wa=waNum(r)?`<button class="wa btn ghost sm" data-wa="${r.id}" aria-label="Mensagem de WhatsApp para ${esc(r.nome)}">WhatsApp</button>`:"";
  if(!podeEditar())return wa;
  if(S.inline&&S.inline.id===r.id){const def=S.inline.val||addDias(hoje(),1);
    return`<input type="date" id="inl" value="${def}" aria-label="${S.inline.tipo==="exame"?"Data do exame":"Data de admissão"}">${S.inline.tipo==="exame"?`<input type="time" id="inlH" value="${esc(S.inline.hora||(S.cfg.clinica||{}).horario||"07:00")}" aria-label="Horário do exame">`:""}${b("okInline","OK","pri")}${b("cancInline","Cancelar","ghost")}`}
  let s="";
  if(e==="Agendar exame")s=b("agendar","Agendar exame");
  else if(e==="Exame marcado")s=b("fez","Fez o exame")+b("faltou","Faltou");
  else if(e==="ASO e documentos")s=(r.aso!=="Apto"?b("apto","ASO apto")+b("inapto","Inapto","danger"):"")+(r.doc!=="OK"?b("docs","Documentos"):"");
  else if(e==="Pronto")s=b("marcar","Marcar admissão");
  else if(e==="Admissão marcada")s=b("admitir","Admitir","pri");
  else if(e==="Pós-admissão")s=b("pos","Checklist");
  return s+wa;
}
function quemCel(r){return`<b class="nm">${esc(r.nome)}</b><span class="sub">${esc(r.funcao)}${r.lider?" | "+esc(r.lider):""}${r.tel1?" | "+esc(r.tel1):""}</span>`}
function passoCel(r){return r._alerta?tag(r._alerta,"red"):r._tarefa?tag(r._tarefa,"amber"):""}
function tabela(rs,o){
  o=o||{};
  return`<div class="tw"><table class="lt"><thead><tr><th>Candidato</th>${o.etapa?"<th>Etapa</th>":""}<th class="num" title="${o.pos?"Dias desde a admissão":"Dias nesta etapa"}">Dias</th><th>Andamento</th><th>Próximo passo</th><th>Ações</th></tr></thead><tbody>
  ${rs.map(r=>`<tr data-open="${r.id}"><td>${quemCel(r)}</td>${o.etapa?`<td class="small">${esc(r._etapa)}</td>`:""}<td class="num"><span class="dias" style="color:var(--${r._alerta?"red":corIdade(r._dias)})">${r._dias}</span></td>
   <td><div class="sig">${sinais(r,true)}</div></td><td>${passoCel(r)}</td><td><div class="acts">${acoes(r)}</div></td></tr>`).join("")}
  </tbody></table></div>`;
}
const ordenar=rs=>rs.sort((a,b)=>(!!b._alerta-!!a._alerta)||b._dias-a._dias||a.nome.localeCompare(b.nome,"pt"));

/* ---------- em processo ---------- */
function listaProcesso(){let at=ativos();if(S.f.etapa)at=at.filter(r=>r._etapa===S.f.etapa);at=buscaFiltro(at,S.f.q);
  return S.f.etapa?ordenar(at):at.sort((a,b)=>ORD.indexOf(a._etapa)-ORD.indexOf(b._etapa)||(!!b._alerta-!!a._alerta)||b._dias-a._dias)}
function vProcesso(){
  const todos=ativos(),lista=listaProcesso();
  const card=(k,n,tone,sub,on)=>`<button class="stc ${on?"on":""}" data-stage="${esc(k)}" style="--tone:${tone}" aria-pressed="${on}"><span class="l">${k||"Todos em processo"}</span><b>${n}</b><span class="s">${sub}</span></button>`;
  const cards=card("",todos.length,"var(--ink)",`${todos.filter(r=>r._alerta||r._parado).length} com atraso ou alerta`,!S.f.etapa)+
    ETAPAS.slice(0,5).map(e=>{const cs=todos.filter(r=>r._etapa===e.k),p=cs.filter(r=>r._alerta||r._parado).length;
      return card(e.k,cs.length,e.tone,p?`<span style="color:var(--red);font-weight:600">${p} atrasado${p>1?"s":""}</span>`:e.hint,S.f.etapa===e.k)}).join("");
  return`<div class="stcards">${cards}</div>
  ${filtroBar({busca:1})}
  <div class="lhead"><h2>${S.f.etapa?esc(S.f.etapa):"Todos em processo"} <span class="muted">${lista.length} candidato(s)</span></h2>${S.downloads&&lista.length?`<button class="btn sm" data-a="expProcesso">Exportar Excel</button>`:""}</div>
  ${lista.length?tabela(lista,{etapa:!S.f.etapa}):`<div class="empty">${todos.length?"Ninguém nesta etapa com esses filtros.":"Nenhum candidato em processo."}${podeEditar()&&!todos.length?`<p><button class="btn pri" data-a="novo">Cadastrar candidato</button></p>`:""}</div>`}`;
}

/* ---------- pendências ---------- */
const GRUPOS=[
 {t:"Exame passou: confirmar se fez",c:"red",f:r=>r._alerta==="Exame passou: confirmar"},
 {t:"Faltou ao exame: reagendar",c:"red",f:r=>r._alerta==="Faltou ao exame"},
 {t:"ASO inapto: registrar desistência",c:"red",f:r=>r._alerta==="ASO inapto"},
 {t:"Admissão vencida: registrar",c:"red",f:r=>r._alerta==="Admissão vencida: registrar"},
 {t:"Possível duplicidade",c:"red",f:r=>r._alerta==="Possível duplicidade"},
 {t:"Cobrar ASO na clínica",c:"amber",f:r=>r._tarefa==="Cobrar ASO"},
 {t:"Documentos pendentes",c:"amber",f:r=>r.situacao==="Em processo"&&r.doc!=="OK"&&r._etapa!=="Agendar exame"},
 {t:"Agendar exame",c:"amber",f:r=>r.situacao==="Em processo"&&r._tarefa==="Agendar exame"&&!r._alerta},
 {t:"Marcar data de admissão",c:"amber",f:r=>r._tarefa==="Marcar admissão"},
 {t:"Pós-admissão incompleto",c:"gray",f:r=>r._etapa==="Pós-admissão"}];
const pendentes=()=>{const rs=filtrados();return[...ativos(rs),...posPend(rs)]};
function contPend(){const ids=new Set();pendentes().forEach(r=>{if(GRUPOS.some(g=>g.f(r)))ids.add(r.id)});return ids.size}
function vPendencias(){
  const base=pendentes();
  const usados=new Set();
  const gs=GRUPOS.map(g=>({...g,rs:ordenar(base.filter(r=>!usados.has(r.id)&&g.f(r)))})).map(g=>{g.rs.forEach(r=>usados.add(r.id));return g}).filter(g=>g.rs.length);
  const cad=filtrados().filter(r=>r.situacao==="Admitido"&&r._tarefa&&!r._tarefa.startsWith("Pós"));
  return`${filtroBar({})}
  ${gs.length?`<div class="chips">${gs.map((g,i)=>`<a class="chip ${g.c==="gray"?"":g.c}" href="#pendencias" data-jump="g${i}">${esc(g.t)} (${g.rs.length})</a>`).join("")}</div>`:""}
  ${gs.length?gs.map((g,i)=>`<section class="pgroup" id="g${i}"><h2><span class="dot" style="background:var(--${g.c==="gray"?"ink3":g.c})"></span>${esc(g.t)} <span class="muted">${g.rs.length}</span></h2>${tabela(g.rs,{etapa:1})}</section>`).join("")
   :`<div class="empty">Nenhuma pendência. Tudo em dia.</div>`}
  ${cad.length?`<p class="small muted" style="margin-top:18px">${cad.length} admitido(s) antigos com cadastro incompleto (data de admissão, ASO ou documentação). <a href="#historico" data-pend="1">Ver no histórico</a></p>`:""}`;
}

/* ---------- pós-admissão ---------- */

/* ---------- histórico ---------- */
function buscaFiltro(rs,q){if(!q)return rs;const n=norm(q),d=dig(q);return rs.filter(r=>norm(r.nome).includes(n)||(d.length>=4&&(dig(r.tel1).includes(d)||dig(r.tel2).includes(d))))}
function listaHistorico(){const tab=S.h.tab;let rs=filtrados().filter(r=>r.situacao===tab);if(S.h.pend)rs=rs.filter(r=>r._tarefa);rs=buscaFiltro(rs,S.h.q);
  const campo=tab==="Admitido"?"dataAdmissao":"dataDesistencia";if(S.h.mes)rs=rs.filter(r=>(r[campo]||"").startsWith(S.h.mes));
  return rs.sort((a,b)=>(b[campo]||"").localeCompare(a[campo]||"")||a.nome.localeCompare(b.nome,"pt"))}
function vHistorico(){
  const tab=S.h.tab,rs=listaHistorico(),campo=tab==="Admitido"?"dataAdmissao":"dataDesistencia";
  const meses=[...new Set(S.rows.filter(r=>r.situacao===tab&&r[campo]).map(r=>r[campo].slice(0,7)))].sort().reverse();
  const nA=S.rows.filter(r=>r.situacao==="Admitido").length,nD=S.rows.filter(r=>r.situacao==="Desistiu").length;
  return`${filtroBar({})}<div class="filters"><div class="seg" role="group" aria-label="Histórico"><button class="${tab==="Admitido"?"on":""}" data-tab="Admitido">Admitidos (${nA})</button><button class="${tab==="Desistiu"?"on":""}" data-tab="Desistiu">Desistências (${nD})</button></div>
   <input type="search" id="hQ" placeholder="Buscar nome ou telefone" value="${esc(S.h.q)}" aria-label="Buscar no histórico">
   <select id="hMes" aria-label="Mês"><option value="">Todos os meses</option>${meses.map(m=>`<option value="${m}" ${S.h.mes===m?"selected":""}>${MES[+m.slice(5)-1]}/${m.slice(2,4)}</option>`).join("")}</select>
   ${tab==="Admitido"?`<label class="small"><input type="checkbox" id="hPend" ${S.h.pend?"checked":""}> Só com pendência</label>`:""}
   <span class="small muted">${rs.length} registro(s)</span>${S.downloads&&rs.length?`<span style="flex:1"></span><button class="btn sm" data-a="expHistorico">Exportar Excel</button>`:""}</div>
   ${rs.length?`<div class="tw"><table class="lt"><thead><tr><th>Nome</th><th>Indicação</th>${tab==="Admitido"?"<th>Admissão</th><th>Pós-admissão</th><th>Pendência</th>":"<th>Data</th><th>Fase</th><th>Motivo</th>"}</tr></thead><tbody>
   ${rs.map(r=>`<tr data-open="${r.id}"><td>${quemCel(r)}</td><td>${esc(r.indicacao)}</td>${tab==="Admitido"?`<td>${br(r.dataAdmissao)}</td><td>${posAplica(r)?(posResumo(r).completo?tag("Completo","green"):tag(posResumo(r).ok+"/"+posResumo(r).tot,"amber")):`<span class="small muted">—</span>`}</td><td>${r._tarefa&&!r._tarefa.startsWith("Pós")?tag(r._tarefa,"amber"):""}</td>`:`<td>${br(r.dataDesistencia)}</td><td class="small">${esc(r.faseDesistencia||"")}</td><td>${esc(r.motivo)}${r.motivoDetalhe?`<div class="small muted">${esc(r.motivoDetalhe)}</div>`:""}</td>`}</tr>`).join("")}
   </tbody></table></div>`:`<div class="empty">Nenhum registro encontrado.</div>`}`;
}

/* ---------- navegação ---------- */
const NAV=[["painel","🏠","Painel"],["novo","➕","Novo candidato"],["pendencias","🟡","Pendências"],["processo","📋","Em processo"],["pos","✅","Pós-admissão"],
  ["historico","🗂️","Histórico"],["encarregados","👷","Encarregados"],["vagas","🎯","Vagas da obra"],["config","⚙️","Configurações"],["usuarios","🔐","Usuários"]];
const VIEWS={painel:vPainel,pendencias:vPendencias,processo:vProcesso,pos:vPos,historico:vHistorico,encarregados:vEncarregados,vagas:vVagas,config:vConfig,usuarios:vUsuarios};
function desenharNav(){
  const pend=S.loaded?contPend():0,pp=S.loaded?posPend(S.rows).length:0,ep=S.loaded?S.rows.filter(r=>r.situacao==="Em processo").length:0;
  const badge={pendencias:pend?`<span class="badge red">${pend}</span>`:"",processo:ep?`<span class="badge">${ep}</span>`:"",pos:pp?`<span class="badge">${pp}</span>`:""};
  const pu=S.usuarios.filter(u=>u.papel==="pendente").length;if(pu&&ehAdmin())badge.usuarios=`<span class="badge red">${pu}</span>`;
  $("#nav").innerHTML=NAV.filter(([k])=>(k!=="novo"||podeEditar())&&(k!=="usuarios"||ehAdmin())).map(([k,ic,t])=>k==="novo"
    ?`<button type="button" class="ni" data-a="novo"><span class="ic" aria-hidden="true">${ic}</span><span class="tx">${t}</span></button>`
    :`<a class="ni ${vista===k?"on":""}" href="#${k}" ${vista===k?'aria-current="page"':""}><span class="ic" aria-hidden="true">${ic}</span><span class="tx">${t}</span>${badge[k]||""}</a>`).join("");
}
let vista="painel";
function render(){
  let v=(location.hash||"#painel").slice(1);if(v==="quadro")v="processo";if(v==="listas")v="config";
  vista=VIEWS[v]?v:"painel";
  if(!["encarregados","vagas"].includes(vista))S.ed=null;
  desenharNav();
  $("#ptitle").textContent=(NAV.find(n=>n[0]===vista)||NAV[0])[2];

function dadosLimpos(r){const d={};for(const k in r){if(k==="id"||k.startsWith("_"))continue;d[k]=r[k]}return d}
async function salvar(id,patch,txt){
  const cur=S.rows.find(r=>r.id===id);if(!cur)return false;
  const novo={...cur,...patch};
  if(etapa(novo)!==etapa(cur))patch.etapaDesde=hoje();
  patch.log=[...(cur.log||[]),{em:new Date().toISOString(),por:"local",txt}].slice(-40);
  patch.atualizadoEm=new Date().toISOString();
  const i=S.rows.indexOf(cur);S.rows[i]={...cur,...patch};sincronizarRows();
  if(!gravarBase()){S.rows[i]=cur;sincronizarRows();return false}
  render();return true;
}
async function criar(data){
  const agora=new Date().toISOString(),id=novoId();
  S.rows.push({id,...VAZIO,...data,etapaDesde:hoje(),criadoEm:agora,atualizadoEm:agora,log:[{em:agora,por:"local",txt:"Cadastrado"}]});sincronizarRows();
  if(!gravarBase()){S.rows.pop();sincronizarRows();return null}
  render();return id;
}

async function importarBackup(file){

  pedir({titulo:"Restaurar backup?",texto:`O arquivo tem <b>${d.candidatos.length}</b> candidato(s), gerado em ${br((d.geradoEm||"").slice(0,10))}. Os <b>${S.rows.length}</b> candidato(s) atuais deste navegador serão substituídos. Isso não pode ser desfeito.`,ok:"Restaurar",okCls:"danger"},()=>{

function andamentoTxt(r){
  if(r.situacao==="Desistiu")return`Desistiu em ${br(r.dataDesistencia)||"—"}${r.motivo?" | "+r.motivo:""}`;
  if(r.situacao==="Admitido"){const p=posResumo(r);return`Admitido em ${br(r.dataAdmissao)||"—"}${posAplica(r)?` | Pós-admissão ${p.completo?"concluído":p.ok+"/"+p.tot}`:""}`}
  const d=r._docs,h=hoje(),partes=[];
  partes.push(`Docs ${d.completo?"OK":d.ok+"/"+d.tot}`);
  if(r.fezExame==="Sim")partes.push("Exame feito");else if(r.fezExame==="Não")partes.push("Faltou ao exame");
  else if(r.dataExame)partes.push(`Exame ${brc(r.dataExame)}${r.horaExame?" "+r.horaExame:""}${r.dataExame<h?" (confirmar)":""}`);else partes.push("Exame a agendar");
  partes.push(r.aso==="Apto"?"ASO apto":r.aso==="Inapto"?"ASO inapto":"ASO pendente");

}
function dadosRelatorio(){

  const f=REL.conteudo==="todos"?(r=>sel.processo(r)||sel.pos(r)||sel.adm(r)||sel.des(r)):sel[REL.conteudo];
  const ordemEt=[...ORD,"Admitido","Desistiu"];
  const lista=rs.filter(f).sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  const chave=r=>REL.grupo==="lider"?(r.lider||"Sem líder"):r._etapa;
  const nomes=[...new Set(lista.map(chave))].sort((a,b)=>REL.grupo==="lider"?(a==="Sem líder")-(b==="Sem líder")||a.localeCompare(b,"pt"):ordemEt.indexOf(a)-ordemEt.indexOf(b));
  const grupos=nomes.map(n=>({nome:n,rs:lista.filter(r=>chave(r)===n)}));
  const linha=r=>[r.nome,r.funcao||"—",r._etapa,andamentoTxt(r),r.cidade||"—",r.rota||"—",r.lider||"—",r.alojado||"—"];
  const filtros=[`Conteúdo: ${REL_CONT[REL.conteudo]}`,["adm","des","todos"].includes(REL.conteudo)?`Período: ${({mes:"mês atual",90:"últimos 90 dias",obra:"obra toda"})[S.per]}`:"",
    S.f.lider?`Líder: ${S.f.lider}`:"",S.f.funcao?`Função: ${S.f.funcao}`:""].filter(Boolean).join("   ·   ");
  const resumo=nomes.map(n=>[n,grupos.find(g=>g.nome===n).rs.length]);

}

    if(vs.some(v=>!v.funcao||!(+v.vagas>0))){$("#vErr").textContent="Preencha a função e um número de vagas maior que zero em cada linha.";return}
    if(new Set(vs.map(v=>v.funcao)).size<vs.length){$("#vErr").textContent="Cada função só pode aparecer uma vez.";return}
    if(await salvarConfig({vagas:vs.map(v=>({funcao:v.funcao,vagas:+v.vagas,desde:v.desde||""}))})){S.ed=null;toast("Vagas salvas")}}
  else if(a==="addEnc"){S.ed.enc.push({nome:"",completo:"",funcao:"",tel:"",ativo:true});render()}
  else if(a==="salvarEnc"){const es=S.ed.enc.filter(e=>e.nome||e.completo).map(e=>({nome:String(e.nome||"").trim(),completo:String(e.completo||"").trim(),funcao:String(e.funcao||"").trim(),tel:String(e.tel||"").trim(),ativo:e.ativo!==false}));
    if(es.some(e=>!e.nome)){$("#eErr").textContent="Informe o apelido de cada encarregado.";return}
    if(new Set(es.map(e=>norm(e.nome))).size<es.length){$("#eErr").textContent="Há apelidos repetidos. Cada encarregado precisa de um apelido diferente.";return}
    if(await salvarConfig({encarregados:es})){S.ed=null;toast("Encarregados salvos")}}
  else if(a==="salvarMsgs"){const v=id=>$("#"+id).value.trim();
    if(await salvarConfig({clinica:{nome:v("c_cl_nome"),endereco:v("c_cl_end"),horario:v("c_cl_hor")},obra:{endereco:v("c_ob_end"),horario:v("c_ob_hor"),levar:v("c_ob_lev")},msgs:{exame:v("c_m_exame"),docs:v("c_m_docs"),admissao:v("c_m_admissao")}})){document.activeElement&&document.activeElement.blur();toast("Mensagens salvas");render()}}
  else if(a==="restaurarMsgs"){["exame","docs","admissao"].forEach(k=>$("#c_m_"+k).value=MSGS_PADRAO[k]);toast("Textos padrão restaurados. Clique em Salvar mensagens para manter.")}
  else if(a==="salvarPos"){const v=$("#c_posDesde").value;if(!v){toast("Informe a data.");return}if(await salvarConfig({posDesde:v})){$("#c_posDesde").blur();toast("Data salva");render()}}
  else if(a==="salvarListas"){const L={};["funcoes","indicacoes","motivos","rotas"].forEach(k=>L[k]=[...new Set($("#L_"+k).value.split("\n").map(s=>s.trim()).filter(Boolean))]);
    if(await salvarConfig(L)){document.activeElement&&document.activeElement.blur();toast("Listas salvas");render()}}
  else if(a==="exportarBackup")exportarBackup();
  else if(a==="relatorio")relatorio();
  else if(a==="expProcesso")baixar(`Em_processo_${hoje()}.xlsx`,[["Em processo",listaProcesso().map(linhaExp)]]);
  else if(a==="expHistorico")baixar(`${S.h.tab==="Admitido"?"Admitidos":"Desistencias"}_${hoje()}.xlsx`,[[S.h.tab==="Admitido"?"Admitidos":"Desistências",listaHistorico().map(linhaExp)]]);
});

/* ---------- acesso com senha (neste navegador) ---------- */
S.db=true;S.canWrite=true;S.usuarios=[];S.perfil=null;S.auth="carregando";
S.downloads={save:async({filename,data})=>{const blob=new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}};
const LOGO=document.querySelector(".sbrand .logoimg").getAttribute("src");
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function derivar(senha,salHex){
  const sal=new Uint8Array(salHex.match(/../g).map(h=>parseInt(h,16)));
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:sal,iterations:150000,hash:"SHA-256"},k,256));
}
const lerAcesso=()=>{try{return JSON.parse(localStorage.getItem(CHAVE_SENHA)||"null")}catch(e){return null}};

function telaAuth(msg,tipo){
  const el=$("#auth");document.body.classList.add("bloqueado");el.hidden=false;
  const m=msg?`<p class="amsg ${tipo||""}" role="status">${msg}</p>`:"";
  const caixa=c=>`<div class="abox"><img src="${LOGO}" alt="Rio Ave" class="alogo"><p class="asys">Sistema de admissões</p>${m}${c}</div>`;
  const ac=lerAcesso(),a=S.auth;let h;
  if(!window.crypto||!crypto.subtle)h=caixa(`<h1>Navegador sem suporte</h1><p class="small">Abra o sistema pelo endereço do GitHub Pages (https) em um navegador atualizado, como Chrome ou Edge.</p>`);
  else if(a==="criar"||!ac)h=caixa(`<h1>Primeiro acesso</h1><p class="small muted" style="margin-top:0">Crie a senha que vai proteger o sistema neste computador.</p>
    <form id="fCriar" novalidate><label>Seu nome<input id="aNome" autocomplete="name" required></label>
    <label>Senha (mínimo 6 caracteres)<input type="password" id="aSenha" autocomplete="new-password" required></label>
    <label>Repita a senha<input type="password" id="aSenha2" autocomplete="new-password" required></label>
    <button class="btn pri" type="submit">Criar senha e entrar</button></form>`);
  else if(a==="esqueci")h=caixa(`<h1>Esqueci minha senha</h1><p class="small">A senha fica guardada só neste navegador e não tem como ser recuperada. Você pode criar uma nova senha: <b>os candidatos cadastrados são mantidos</b>.</p>
    <form id="fRedef" novalidate><label>Para confirmar, digite REDEFINIR<input id="aConf" autocomplete="off" required></label><button class="btn pri" type="submit">Criar nova senha</button></form>
    <p class="alinks"><a href="#" data-auth="entrar">Voltar</a></p>`);
  else h=caixa(`<h1>Entrar</h1><p class="small muted" style="margin-top:0">Olá, ${esc(ac.nome||"")}.</p><form id="fEntrar" novalidate>
    <label>Senha<input type="password" id="aSenha" autocomplete="current-password" required></label><button class="btn pri" type="submit">Entrar</button></form>
    <p class="alinks"><a href="#" data-auth="esqueci">Esqueci minha senha</a></p>`);
  el.innerHTML=h;const f=el.querySelector("form input");if(f)f.focus();
}
function fecharAuth(){$("#auth").hidden=true;$("#auth").innerHTML="";document.body.classList.remove("bloqueado")}
function entrarNoSistema(nome){
  try{sessionStorage.setItem("rioave_admissoes_sessao","1")}catch(e){}
  S.perfil={nome,papel:"admin",ativo:true};fecharAuth();desenharUsuario();
  BASE=lerBase();S.rows=BASE.candidatos.map(c=>({...VAZIO,...c}));aplicarConfig(BASE.config);S.loaded=true;S.stale=false;
  $("#sync").textContent="Dados salvos neste navegador";render();
}
document.addEventListener("submit",async ev=>{
  const f=ev.target;if(!f.closest||!f.closest("#auth"))return;ev.preventDefault();
  const btn=f.querySelector("button[type=submit]");btn.disabled=true;
  try{
    if(f.id==="fCriar"){const nome=$("#aNome").value.trim(),a=$("#aSenha").value,b=$("#aSenha2").value;
      if(!nome)return telaAuth("Informe seu nome.","err");if(a.length<6)return telaAuth("A senha precisa ter pelo menos 6 caracteres.","err");if(a!==b)return telaAuth("As senhas não conferem.","err");
      const sal=hex(crypto.getRandomValues(new Uint8Array(16)));const hash=await derivar(a,sal);
      localStorage.setItem(CHAVE_SENHA,JSON.stringify({nome,sal,hash,criadoEm:new Date().toISOString()}));S.auth="entrar";entrarNoSistema(nome)}
    else if(f.id==="fEntrar"){const ac=lerAcesso();const hash=await derivar($("#aSenha").value,ac.sal);
      if(hash!==ac.hash){S._erros=(S._erros||0)+1;await new Promise(r=>setTimeout(r,Math.min(4000,400*S._erros)));return telaAuth("Senha incorreta.","err")}
      S._erros=0;entrarNoSistema(ac.nome)}
    else if(f.id==="fRedef"){if($("#aConf").value.trim().toUpperCase()!=="REDEFINIR")return telaAuth("Digite REDEFINIR para confirmar.","err");
      localStorage.removeItem(CHAVE_SENHA);S.auth="criar";telaAuth("Crie a nova senha. Seus dados foram mantidos.","ok")}
  }finally{if(document.contains(btn))btn.disabled=false}
});
document.addEventListener("click",ev=>{const a=ev.target.closest("[data-auth]");if(!a)return;ev.preventDefault();
  if(a.dataset.auth==="sair"){sair();return}S.auth=a.dataset.auth;telaAuth()});
function sair(){try{sessionStorage.removeItem("rioave_admissoes_sessao")}catch(e){}$("#dlg").open&&$("#dlg").close();$("#mini").open&&$("#mini").close();S.auth="entrar";telaAuth()}
function desenharUsuario(){const p=S.perfil;$("#ufoot").innerHTML=p?`<div class="uname">${esc(p.nome)}</div><div class="urole">Acesso neste computador</div><button type="button" class="btn sm ghost" data-auth="sair">Sair</button>`:""}
/* bloqueia depois de 30 minutos sem uso */
let ultimoUso=Date.now();["click","keydown","pointermove","scroll"].forEach(e=>document.addEventListener(e,()=>{ultimoUso=Date.now()},{passive:true}));
setInterval(()=>{if(S.perfil&&$("#auth").hidden&&Date.now()-ultimoUso>30*60*1000){sair();telaAuth("Sistema bloqueado por inatividade. Entre novamente.")}},60000);

(()=>{
  const ac=lerAcesso();let ativa=false;try{ativa=sessionStorage.getItem("rioave_admissoes_sessao")==="1"}catch(e){}
  if(ac&&ativa)entrarNoSistema(ac.nome);else{S.auth=ac?"entrar":"criar";telaAuth()}
})();
